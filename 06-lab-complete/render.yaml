services:
  - type: web
    name: ai-agent-cluster
    runtime: docker
    dockerContext: 06-lab-complete
    dockerfilePath: 06-lab-complete/Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: "Alpha-Groq Agent Cluster"
      
      # Redis Connection (Injected from Render Redis service)
      - key: REDIS_URL
        fromService:
          type: redis
          name: agent-cache
          property: connectionString

      # Secrets - Change these in Render Dashboard
      - key: GROQ_API_KEY
        sync: false
      - key: AGENT_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true

      - key: LLM_MODEL
        value: "llama-3.1-8b-instant"
      - key: DAILY_BUDGET_USD
        value: "10.0"
      - key: RATE_LIMIT_PER_MINUTE
        value: "50"

  # Managed Redis Instance
  - type: redis
    name: agent-cache
    region: singapore
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all connections (secured by password)

