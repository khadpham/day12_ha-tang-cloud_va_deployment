services:
  - type: web
    name: ai-agent-cluster
    runtime: docker
    dockerContext: 06-lab-complete
    dockerfilePath: Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: "Alpha-Groq Agent Cluster"
      - key: REDIS_URL
        fromService:
          type: redis
          name: agent-redis
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: AGENT_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_MODEL
        value: "llama-3.1-8b-instant"
      - key: DAILY_BUDGET_USD
        value: "10.0"
      - key: RATE_LIMIT_PER_MINUTE
        value: "50"

  - type: redis
    name: agent-redis
    region: singapore
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all
